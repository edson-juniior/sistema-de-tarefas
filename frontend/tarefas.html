<!DOCTYPE html>
<html>

<head>
    <title>Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <span>📋 Sistema de Tarefas</span>

        <div class="menu">
            <a href="usuarios.html">👥 Usuários</a>
            <a href="tarefas.html">📋 Tarefas</a>
            <button onclick="logout()">Sair</button>
        </div>
    </div>

    <!-- CARD -->
    <div class="tarefas-container">

        <h2>📋 Minhas Tarefas</h2>

        <!-- DASHBOARD -->
        <div class="dashboard">

            <div class="card-dashboard">
                <h3 id="totalTarefas">0</h3>
                <p>Total</p>
            </div>

            <div class="card-dashboard concluida">
                <h3 id="tarefasConcluidas">0</h3>
                <p>Concluídas</p>
            </div>

            <div class="card-dashboard pendente">
                <h3 id="tarefasPendentes">0</h3>
                <p>Pendentes</p>
            </div>

        </div>

        <!-- USUÁRIO -->
        <p id="nomeUsuario" class="usuario-info"></p>

        <!-- FORM -->
        <div class="form-tarefa">
            <input id="titulo" placeholder="Título">
            <input id="descricao" placeholder="Descrição">

            <select id="prioridade">
                <option value="Baixa"> Baixa</option>
                <option value="Média"> Média</option>
                <option value="Alta"> Alta</option>
            </select>

            <button class="btn-criar" onclick="criarTarefa()">
                Criar
            </button>
        </div>

        <input
         type="text" id="pesquisa" placeholder="🔍 Pesquisar tarefa" onkeyup="carregarTarefas()" class="input-pesquisa"
          />

        <!-- TABELA -->
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>prioridade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaTarefas"></tbody>

        </table>

    </div>

    <script>

        const API = "http://localhost:3000";

        const usuario = JSON.parse(localStorage.getItem("usuario"));

        // LOGIN
        if (!usuario) {
            alert("Você precisa fazer login!");
            window.location.href = "index.html";
        }

        const usuario_id = usuario.id;

        // NOME USUÁRIO
        document.getElementById("nomeUsuario").innerHTML =
            "👤 <strong>Usuário:</strong> " + usuario.nome;

        // CONTROLE EDIÇÃO
        let tarefaEditando = null;

        // =========================
        // CRIAR / EDITAR TAREFA
        // =========================

        function criarTarefa() {

                const titulo = document.getElementById("titulo").value;
                const descricao = document.getElementById("descricao").value;
                const prioridade = document.getElementById("prioridade").value;

                // VALIDAÇÃO
                if (!titulo || !descricao) {
                    alert("Preencha todos os campos");
                    return;
                }

                // ======================
                // EDITAR
                // ======================

                if (tarefaEditando) {

                    fetch(API + "/tarefas/" + tarefaEditando, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            titulo: titulo,
                            descricao: descricao,
                            prioridade: prioridade
                        })
                    })
                        .then(res => res.text())
                        .then(msg => {

                            alert(msg);

                            tarefaEditando = null;

                            document.querySelector(".btn-criar").innerText = "Criar";

                            document.getElementById("titulo").value = "";
                            document.getElementById("descricao").value = "";
                            document.getElementById("prioridade").value = "Baixa";

                            carregarTarefas();
                            carregarDashboard();

                        });

                    return;

                    if (titulo.trim().length < 3) {
                        alert("Título muito curto");
                        return;
                    }
                }

                // ======================
                // CRIAR
                // ======================

                fetch(API + "/tarefas", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        titulo,
                        descricao,
                        prioridade,
                        usuario_id
                    })
                })
                    .then(res => res.text())
                    .then(msg => {

                        alert(msg);

                        document.getElementById("titulo").value = "";
                        document.getElementById("descricao").value = "";
                        document.getElementById("prioridade").value = "Baixa";

                        carregarTarefas();
                        carregarDashboard();

                    });

            }

        // =========================
        // LISTAR TAREFAS
        // =========================

        function carregarTarefas() {

                const pesquisa = document
                    .getElementById("pesquisa")
                    .value
                    .toLowerCase();

                fetch(API + "/tarefas/" + usuario_id)
                    .then(res => res.json())
                    .then(tarefas => {

                        const lista = document.getElementById("listaTarefas");
                        lista.innerHTML = "";

                        tarefas
                            .filter(tarefa =>
                                tarefa.titulo.toLowerCase().includes(pesquisa)
                            )
                            .forEach(tarefa => {

                                lista.innerHTML += `
                    <tr>

                        <td>${tarefa.id}</td>

                        <td>${tarefa.titulo}</td>

                        <td>${tarefa.descricao}</td>

                        <td class="
                            ${tarefa.prioridade === 'Alta'
                                        ? 'prioridade-alta'
                                        : tarefa.prioridade === 'Média'
                                            ? 'prioridade-media'
                                            : 'prioridade-baixa'}
                        ">
                            ${tarefa.prioridade}
                        </td>

                        <td class="
                            ${tarefa.status === 'Concluída'
                                        ? 'status-Concluida'
                                        : 'status-Pendente'}
                        ">
                            ${tarefa.status}
                        </td>

                        <td class="acoes">

                            ${tarefa.status !== 'Concluída'
                                        ? `
                                <button
                                    class="btn-concluir"
                                    onclick="concluir(${tarefa.id})">
                                    Concluir
                                </button>
                                `
                                        : '<div style="width:100px"></div>'
                                    }

                            <button
                                class="btn-editar"
                                onclick="editar(
                                    ${tarefa.id},
                                    '${tarefa.titulo}',
                                    '${tarefa.descricao}',
                                    '${tarefa.prioridade}'
                                )">
                                Editar
                            </button>

                            <button
                                class="btn-excluir"
                                onclick="excluir(${tarefa.id})">
                                Excluir
                            </button>

                        </td>

                    </tr>
                    `;
                            });

                    });

            }

        // =========================
        // EDITAR
        // =========================

        function editar(id, titulo, descricao, prioridade) {

                document.getElementById("titulo").value = titulo;
                document.getElementById("descricao").value = descricao;
                document.getElementById("prioridade").value = prioridade;

                tarefaEditando = id;

                document.querySelector(".btn-criar").innerText = "Salvar";

            }

        function concluir(id) {

                fetch(API + "/tarefas/concluir/" + id, {
                    method: "PUT"
                })
                    .then(res => res.text())
                    .then(msg => {

                        alert(msg);

                        carregarTarefas();
                        carregarDashboard();

                    });

            }
        // =========================
        // EXCLUIR
        // =========================

        function excluir(id) {

            if (!confirm("Deseja excluir essa tarefa?")) return;

            fetch(API + "/tarefas/" + id, {
                method: "DELETE"
            })
                .then(res => res.text())
                .then(msg => {

                    alert(msg);

                    carregarTarefas();
                    carregarDashboard();

                });

        }

        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem("usuario");

            window.location.href = "index.html";

        }

        // =========================
        // DASHBOARD
        // =========================

        function carregarDashboard() {

            fetch(API + "/dashboard/" + usuario_id)
                .then(res => res.json())
                .then(data => {

                    document.getElementById("totalTarefas").innerText =
                        data.total || 0;

                    document.getElementById("tarefasConcluidas").innerText =
                        data.concluidas || 0;

                    document.getElementById("tarefasPendentes").innerText =
                        data.pendentes || 0;

                });

        }

        // =========================
        // LOAD
        // =========================

        window.onload = () => {

            carregarTarefas();
            carregarDashboard();

        };

    </script>

</body>

</html>
