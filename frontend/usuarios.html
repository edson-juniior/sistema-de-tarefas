<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Usuários - Sistema de Tarefas</title>
    <link rel="stylesheet" href="usuarios.css">
</head>

<body>

    <div class="navbar">
        📋 Sistema de Tarefas
    </div>

    <div class="container">

        <div class="card">

            <div class="header">
                <h2>👥 Usuários cadastrados</h2>

                <a href="index.html">
                    <button class="btnVoltar">Voltar</button>
                </a>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaUsuarios"></tbody>

            </table>

            <button class="btnAtualizar" onclick="carregarUsuarios()">
                Atualizar lista
            </button>

        </div>

    </div>

    <script>

        const API = "http://localhost:3000";

        function carregarUsuarios() {

            fetch(API + "/usuarios")

                .then(response => response.json())

                .then(usuarios => {

                    const tabela = document.getElementById("tabelaUsuarios");
                    tabela.innerHTML = "";

                    usuarios.forEach(usuario => {

                        const linha = `
<tr>
<td>${usuario.id}</td>
<td>${usuario.nome}</td>
<td>${usuario.email}</td>
<td>
<button class="btnExcluir" onclick="excluirUsuario(${usuario.id})">
Excluir
</button>
</td>
</tr>
`;

                        tabela.innerHTML += linha;

                    });

                });

        }

        function excluirUsuario(id) {

            if (!confirm("Deseja excluir este usuário?")) return;

            fetch(API + "/usuarios/" + id, {
                method: "DELETE"
            })

                .then(response => response.text())

                .then(msg => {
                    alert(msg);
                    carregarUsuarios();
                });

        }

        window.onload = carregarUsuarios;

    </script>

</body>

</html>
