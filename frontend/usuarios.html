<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Usuários - Sistema de Tarefas</title>
    <link rel="stylesheet" href="usuarios.css">
</head>

<body>

    <div class="navbar">
        📋 Sistema de Tarefas
    </div>

    <div class="container">

        <div class="card">

            <div class="header">
                <h2>👥 Usuários cadastrados</h2>

                <a href="index.html">
                    <button class="btnVoltar">Voltar</button>
                </a>
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaUsuarios"></tbody>

            </table>

            <button class="btnAtualizar" onclick="carregarUsuarios()">
                Atualizar lista
            </button>

        </div>

        <div class="navbar">
            <span>🚀 Sistema de Tarefas</span>
        
            <div class="menu">
                <a href="usuarios.html">👥 Usuários</a>
                <a href="tarefas.html">📋 Tarefas</a>
                <button onclick="logout()">Sair</button>
            </div>
        </div>

    </div>

    <script>

        const API = "http://localhost:3000";

        function carregarUsuarios() {

            fetch(API + "/usuarios")

                .then(response => response.json())

                .then(usuarios => {

                    const tabela = document.getElementById("tabelaUsuarios");
                    tabela.innerHTML = "";

                    usuarios.forEach(usuario => {

                        const linha = `
<tr>
<td>${usuario.id}</td>
<td>${usuario.nome}</td>
<td>${usuario.email}</td>
<td>
<button onclick="verTarefas(${usuario.id}, '${usuario.nome}')">
Ver tarefas
</button>

<button class="btnExcluir" onclick="excluirUsuario(${usuario.id})">
Excluir
</button>
</td>
</tr>
`;

                        tabela.innerHTML += linha;

                    });

                });

        }

        function excluirUsuario(id) {

            if (!confirm("Deseja excluir este usuário?")) return;

            fetch(API + "/usuarios/" + id, {
                method: "DELETE"
            })

                .then(response => response.text())

                .then(msg => {
                    alert(msg);
                    carregarUsuarios();
                });

        }

        function logout() {
                localStorage.removeItem("usuario_id");
                localStorage.removeItem("usuario_nome");
                window.location.href = "index.html";
            }
        function verTarefas(id, nome) {

                // salva o usuário no navegador
                localStorage.setItem("usuario", JSON.stringify({
                    id: id,
                    nome: nome
                }));

                // redireciona pra tela de tarefas
                window.location.href = "tarefas.html";
            }    

        window.onload = carregarUsuarios;

    </script>

</body>

</html>
