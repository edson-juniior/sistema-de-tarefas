<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 400px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h2>Cadastro de Usuário</h2>

            <input type="text" id="nome" placeholder="Nome">

            <input type="email" id="email" placeholder="Email">

            <input type="password" id="senha" placeholder="Senha">

            <button onclick="cadastrar()">Cadastrar</button>

        </div>

    </div>

    <script>

        function cadastrar() {

            const nome = document.getElementById("nome").value
            const email = document.getElementById("email").value
            const senha = document.getElementById("senha").value

            fetch("http://localhost:3000/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha
                })

            })

                .then(res => res.text())

                .then(msg => {

                    alert(msg)

                    window.location.href = "usuarios.html"

                })

        }

    </script>

</body>

</html>
